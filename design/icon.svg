<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- App signature gradient: #667eea → #764ba2 at 135° -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>

    <!-- Subtle drop shadow for the white elements to lift them off the gradient -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background (22% corner radius — macOS / iOS standard) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bgGradient)"/>

  <!-- Three rounded finder patterns. Outer white ring + gradient cutout + white pupil.
       Coordinates mimic real QR finder-pattern positions to stay recognizable. -->
  <g filter="url(#softShadow)">
    <!-- Top-left eye -->
    <circle cx="280" cy="280" r="150" fill="#ffffff"/>
    <circle cx="280" cy="280" r="100" fill="url(#bgGradient)"/>
    <circle cx="280" cy="280" r="60"  fill="#ffffff"/>

    <!-- Top-right eye -->
    <circle cx="744" cy="280" r="150" fill="#ffffff"/>
    <circle cx="744" cy="280" r="100" fill="url(#bgGradient)"/>
    <circle cx="744" cy="280" r="60"  fill="#ffffff"/>

    <!-- Bottom-left eye -->
    <circle cx="280" cy="744" r="150" fill="#ffffff"/>
    <circle cx="280" cy="744" r="100" fill="url(#bgGradient)"/>
    <circle cx="280" cy="744" r="60"  fill="#ffffff"/>
  </g>

  <!-- Data dots in the bottom-right: hints at "QR" without being busy.
       Varied opacity gives life / depth. -->
  <g fill="#ffffff">
    <circle cx="580" cy="580" r="24"/>
    <circle cx="650" cy="580" r="24" opacity="0.6"/>
    <circle cx="720" cy="580" r="24"/>
    <circle cx="790" cy="580" r="24" opacity="0.75"/>

    <circle cx="580" cy="650" r="24" opacity="0.55"/>
    <circle cx="720" cy="650" r="24"/>
    <circle cx="790" cy="650" r="24" opacity="0.85"/>

    <circle cx="650" cy="720" r="24"/>
    <circle cx="720" cy="720" r="24" opacity="0.7"/>
    <circle cx="790" cy="720" r="24"/>

    <circle cx="580" cy="790" r="24" opacity="0.65"/>
    <circle cx="650" cy="790" r="24"/>
    <circle cx="790" cy="790" r="24" opacity="0.55"/>
  </g>
</svg>
