<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2064 2752" width="2064" height="2752">
  <defs>
    <linearGradient id="ipadBgG" x1="0" y1="0" x2="2064" y2="2752" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="ipadScreenG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b8fef"/>
      <stop offset="1" stop-color="#8a5fb8"/>
    </linearGradient>
    <linearGradient id="ipadCtaG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4D33D9"/>
      <stop offset="1" stop-color="#8C3BBF"/>
    </linearGradient>
    <filter id="ipadDeviceShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28"/>
      <feOffset dx="0" dy="20" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ipadCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="2064" height="2752" fill="url(#ipadBgG)"/>
  
  
    <g text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
      <text x="1032" y="200" font-size="130" font-weight="700" letter-spacing="-2">Zero tracking.</text>
      <text x="1032" y="360" font-size="130" font-weight="700" letter-spacing="-2" opacity="0.92">Zero servers.</text>
    </g>
  

  <!-- Big lock icon -->
  <g>
    <circle cx="1032" cy="800" r="160" fill="#ffffff" opacity="0.2"/>
    <circle cx="1032" cy="800" r="140" fill="#ffffff"/>
    <path d="M 982 780
             V 742
             a 50 50 0 0 1 100 0
             V 780"
          stroke="#4D33D9" stroke-width="18" fill="none" stroke-linecap="round"/>
    <rect x="962" y="784" width="140" height="100" rx="20" ry="20" fill="#4D33D9"/>
    <circle cx="1032" cy="824" r="10" fill="#ffffff"/>
    <rect x="1027" y="824" width="10" height="28" fill="#ffffff"/>
  </g>

  <!-- Statement -->
  <text x="1032" y="1100" text-anchor="middle" font-size="60" font-weight="700" fill="#ffffff" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">100% local. 100% private.</text>

  <!-- Promise cards stacked -->
  
    <rect x="220" y="1160" width="1624" height="240" rx="28" ry="28" fill="#ffffff" opacity="0.2"/>
    <circle cx="320" cy="1280" r="64" fill="#ffffff"/>
    
        <path d="M 286 1280 Q 320 1252.8 354 1280 Q 320 1307.2 286 1280 Z" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="320" cy="1280" r="11.899999999999999" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="276" y1="1252" x2="364" y2="1308" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
      
    <text x="440" y="1260" font-size="40" font-weight="700" fill="#ffffff" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">No analytics</text>
    <text x="440" y="1318" font-size="28" fill="#ffffff" opacity="0.85" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">No SDKs, no telemetry.</text>
  
    <rect x="220" y="1436" width="1624" height="240" rx="28" ry="28" fill="#ffffff" opacity="0.2"/>
    <circle cx="320" cy="1556" r="64" fill="#ffffff"/>
    
        <rect x="286" y="1532.2" width="68" height="47.599999999999994" rx="6.12" ry="6.12" stroke="#60a5fa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="320" cy="1556" r="10.88" stroke="#60a5fa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <line x1="276" y1="1528" x2="364" y2="1584" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
      
    <text x="440" y="1536" font-size="40" font-weight="700" fill="#ffffff" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">No storage</text>
    <text x="440" y="1594" font-size="28" fill="#ffffff" opacity="0.85" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">Ephemeral by default.</text>
  
    <rect x="220" y="1712" width="1624" height="240" rx="28" ry="28" fill="#ffffff" opacity="0.2"/>
    <circle cx="320" cy="1832" r="64" fill="#ffffff"/>
    
        <path d="M 289.4 1840.5 Q 284.3 1826.9 303 1821.8 Q 309.8 1806.5 323.4 1813.3 Q 340.4 1806.5 348.9 1823.5 Q 355.7 1840.5 340.4 1843.9 L 296.2 1843.9 Z" stroke="#f472b6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="313.2" y="1828.6" width="13.600000000000001" height="11.899999999999999" rx="4" ry="4" fill="#f472b6"/>
      
    <text x="440" y="1812" font-size="40" font-weight="700" fill="#ffffff" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">Private iCloud</text>
    <text x="440" y="1870" font-size="28" fill="#ffffff" opacity="0.85" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">Your container, not ours.</text>
  

  
    <g text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#ffffff">
      <text x="1032" y="2108" font-size="52" font-weight="500" opacity="0.95">Your content never leaves your device.</text>
    </g>
  

</svg>
